name: "Request — Find AI-related help"
description: "Describe a problem or skill you want to find, learn, or commission"
labels: ["request"]
body:
  - type: markdown
    attributes:
      value: "This will be public. Keep personal contact details and sensitive project materials private."
  - type: textarea
    id: need
    attributes:
      label: "What are you trying to do or learn?"
      placeholder: "I want help using AI to..."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "What have you tried? (optional)"
    validations:
      required: false
  - type: dropdown
    id: intent
    attributes:
      label: "What would help?"
      options:
        - "Learn from someone"
        - "Discuss or collaborate"
        - "Hire or commission help"
        - "Not sure yet"
    validations:
      required: true
  - type: input
    id: terms
    attributes:
      label: "Budget, location, or time constraints (optional)"
      placeholder: "Remote / Taiwan / negotiable / budget and currency"
    validations:
      required: false
