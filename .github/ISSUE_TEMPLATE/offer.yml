name: "Offer — Share AI work"
description: "Show what you did with AI and how others may learn or collaborate"
labels: ["offer"]
body:
  - type: markdown
    attributes:
      value: "This will be public. Share only work and details you are authorized to disclose."
  - type: input
    id: work
    attributes:
      label: "What did you actually do with AI?"
      placeholder: "I used AI to make a reusable workflow for..."
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: "Something you built or did recently (optional)"
      description: "Share one concrete example: what problem did you solve, what did you make, or what happened? A short firsthand description is enough. Public links are welcome. Do not share private client data."
      placeholder: "Recently, I used AI to... The result was..."
    validations:
      required: false
  - type: textarea
    id: invitation
    attributes:
      label: "What are you open to?"
      placeholder: "Questions, teaching, paid help, feedback, collaboration..."
    validations:
      required: true
  - type: input
    id: terms
    attributes:
      label: "Terms (optional)"
      placeholder: "Free / paid (discuss first) / price range and currency"
    validations:
      required: false
